site_name: PS1Godot
site_description: Author PlayStation 1 games in Godot. Splashpack export, PS1 shader, Lua scripting, F5 → PCSX-Redux.
site_url: https://buffjesus.github.io/PS1Godot/
site_author: BuffJesus

repo_url: https://github.com/BuffJesus/PS1Godot
repo_name: BuffJesus/PS1Godot
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Use system preference
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/BuffJesus/PS1Godot
      name: PS1Godot on GitHub

# Hand-authored guides for nodes, docks, per-bucket overviews, plus the
# Lua API reference will join the nav as they're written. The current
# nav lists existing content in its new home; "NEW" pages from the
# restructure mapping land in follow-up commits.
nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - First tutorial (hello cube): tutorial-hello-cube.md
      - Basic scene tutorial: tutorial-basic-scene.md
  - Authoring:
      - Fixed cameras: authoring/fixed-cameras.md
      - Graphs:
          - Dialogue: authoring/graphs/dialogue.md
          - FSM: authoring/graphs/fsm.md
          - Quest: authoring/graphs/quest.md
          - Behavior Tree: authoring/graphs/behavior-tree.md
      - Audio:
          - Routing: authoring/audio/routing.md
          - Sequenced music: authoring/audio/sequenced-music.md
      - UI & assets:
          - Custom boot logo: authoring/ui/custom-boot-logo.md
          - SplashEdit import: authoring/ui/splashedit-import.md
  - Lua API:
      - Overview: lua-api/index.md
      - Animation: lua-api/animation.md
      - Audio: lua-api/audio.md
      - Camera: lua-api/camera.md
      - Controls: lua-api/controls.md
      - Convert: lua-api/convert.md
      - Cutscene: lua-api/cutscene.md
      - Debug: lua-api/debug.md
      - Dialog: lua-api/dialog.md
      - Entity: lua-api/entity.md
      - GameState: lua-api/game-state.md
      - Input: lua-api/input.md
      - Interact: lua-api/interact.md
      - Math: lua-api/math.md
      - Music: lua-api/music.md
      - Persist: lua-api/persist.md
      - Physics: lua-api/physics.md
      - Player: lua-api/player.md
      - Random: lua-api/random.md
      - Scene: lua-api/scene.md
      - SkinnedAnim: lua-api/skinned-anim.md
      - Sound: lua-api/sound.md
      - Timer: lua-api/timer.md
      - UI: lua-api/ui.md
      - Vec3: lua-api/vec3.md
  - Reference:
      - Splashpack format: reference/splashpack-format.md
      - API showcase: reference/api-showcase.md
      - Lua cheatsheet: reference/lua-cheatsheet.md
      - Lua editor setup: reference/lua-editor-setup.md
      - psxsplash improvements: reference/psxsplash-improvements.md
  - Contributing:
      - CI: contributing/ci.md

# Exclude internal planning/handoff/RFC docs from the published site
# entirely. They stay in the repo for project authors and future
# sessions — browse on GitHub. See docs/internal/README.md.
exclude_docs: |
  internal/
