name: Build GDExtension (Windows / Linux / macOS)

# Per RFC docs/rfc/linux-support.md Stage 3: build the PS1Lua GDExtension
# across the three desktop platforms so Linux + macOS users don't have to
# clone the repo + install SCons just to get syntax highlighting. The
# resulting per-OS / per-target artifacts get hand-attached to a release
# (or, eventually, autobundled into the plugin zip via build-release.py).

on:
  push:
    branches: [main]
    paths:
      - "godot-ps1/addons/ps1godot/scripting/**"
      - ".github/workflows/build-gdextension.yml"
    tags: ['v*']
  pull_request:
    paths:
      - "godot-ps1/addons/ps1godot/scripting/**"
      - ".github/workflows/build-gdextension.yml"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:     [windows-latest, ubuntu-latest, macos-latest]
        target: [editor, template_debug, template_release]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.target }}
    defaults:
      run:
        working-directory: godot-ps1/addons/ps1godot/scripting

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SCons
        run: pip install --upgrade scons

      # godot-cpp is gitignored locally (~1 GB checkout per dev) — clone
      # it in CI pinned to an exact SHA so an upstream breaking change
      # to the `godot-4.4-stable` branch doesn't silently break every PR.
      # To bump: update GODOT_CPP_SHA to a new known-good SHA from
      # https://github.com/godotengine/godot-cpp/commits/godot-4.4-stable
      # (typically when bumping the .gdextension's compatibility_minimum,
      # or when chasing a new godot-cpp feature). Match the local
      # checkout's HEAD if devs are building locally too — `git -C
      # godot-ps1/addons/ps1godot/scripting/lib/godot-cpp rev-parse HEAD`.
      - name: Clone godot-cpp (pinned SHA)
        shell: bash
        env:
          GODOT_CPP_SHA: d328849e81a5b24e1eb16b250227f3a208a8e654
        run: |
          mkdir -p lib
          if [ ! -d "lib/godot-cpp/.git" ]; then
            # Default clone — full history of the default branch
            # (master). The pinned SHA d328849 is reachable from master,
            # which is what the local-build-known-good checkout uses.
            # GitHub refuses arbitrary-SHA fetches (no
            # allowAnySHA1InWant on github.com), so we need the full
            # branch history, not --depth=1.
            git clone https://github.com/godotengine/godot-cpp.git lib/godot-cpp
          fi
          git -C lib/godot-cpp checkout "$GODOT_CPP_SHA"

      # Cache the compiled godot-cpp bindings — building them from
      # scratch on each CI run is the slow part (~10 min vs ~30 s for
      # our own .cpp). Key on the pinned SHA so a bump invalidates
      # cleanly. (No need to read the live HEAD — the env var IS the
      # source of truth now.)
      - name: Cache godot-cpp build
        uses: actions/cache@v4
        with:
          path: |
            godot-ps1/addons/ps1godot/scripting/lib/godot-cpp/bin
            godot-ps1/addons/ps1godot/scripting/lib/godot-cpp/gen
          key: godot-cpp-${{ matrix.os }}-${{ matrix.target }}-d328849e81a5b24e1eb16b250227f3a208a8e654

      - name: Detect platform name for SCons
        id: platform
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-latest) echo "name=windows" >> "$GITHUB_OUTPUT" ;;
            ubuntu-latest)  echo "name=linux"   >> "$GITHUB_OUTPUT" ;;
            macos-latest)   echo "name=macos"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build GDExtension
        run: scons platform=${{ steps.platform.outputs.name }} target=${{ matrix.target }} -j2

      - name: List build artifacts
        shell: bash
        run: ls -la build/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps1lua-${{ steps.platform.outputs.name }}-${{ matrix.target }}
          path: |
            godot-ps1/addons/ps1godot/scripting/build/*.dll
            godot-ps1/addons/ps1godot/scripting/build/*.so
            godot-ps1/addons/ps1godot/scripting/build/*.dylib
            godot-ps1/addons/ps1godot/scripting/build/*.framework
          if-no-files-found: error
          retention-days: 30

  # Lightweight check: does the C# plugin compile cleanly on each OS?
  # Doesn't load the editor — just runs `dotnet build` to catch C#-side
  # regressions on platforms we don't usually develop on.
  #
  # Wrinkle: PS1Godot.csproj pins `Godot.NET.Sdk/4.7.0-dev.5`, which is a
  # pre-release SDK NOT published to nuget.org. The SDK only ships inside
  # the Godot install at `GodotSharp/Tools/nupkgs/`. CI downloads the
  # matching Godot build, extracts it, and points GODOT_NUPKGS at the
  # nupkgs folder so the dotnet build can resolve the SDK package. Bump
  # GODOT_VERSION below when bumping the SDK pin in PS1Godot.csproj.
  plugin-csharp:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: C# build / ${{ matrix.os }}
    env:
      GODOT_VERSION: "4.7-dev5"
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache Godot SDK download
        id: godot_cache
        uses: actions/cache@v4
        with:
          path: godot-install
          key: godot-${{ env.GODOT_VERSION }}-${{ matrix.os }}

      - name: Download Godot ${{ env.GODOT_VERSION }} (for .NET SDK nupkgs)
        if: steps.godot_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-latest) FLAVOR="win64" ;;
            ubuntu-latest)  FLAVOR="linux_x86_64" ;;
            macos-latest)   FLAVOR="macos.universal" ;;
            *) echo "Unknown OS"; exit 1 ;;
          esac
          URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_${FLAVOR}.zip"
          echo "Downloading $URL"
          curl -L --fail -o godot.zip "$URL"
          mkdir -p godot-install
          unzip -q godot.zip -d godot-install

      - name: Resolve GODOT_NUPKGS path
        shell: bash
        run: |
          NUPKGS=$(find godot-install -type d -name nupkgs | head -1)
          if [ -z "$NUPKGS" ]; then
            echo "ERROR: nupkgs folder not found inside Godot download"
            find godot-install -maxdepth 4 -type d
            exit 1
          fi
          # Need a native-format absolute path. On Linux/macOS `pwd`
          # gives `/path/...` which NuGet understands. On Windows bash
          # is Git Bash / MSYS — plain `pwd` returns the POSIX form
          # `/c/Users/...` which Windows NuGet does NOT accept; use
          # `pwd -W` for the `C:\Users\...` translation.
          if [ "$RUNNER_OS" = "Windows" ]; then
            NUPKGS_ABS=$(cd "$NUPKGS" && pwd -W)
          else
            NUPKGS_ABS=$(cd "$NUPKGS" && pwd)
          fi
          echo "GODOT_NUPKGS=$NUPKGS_ABS" >> "$GITHUB_ENV"
          echo "Found nupkgs at: $NUPKGS_ABS"

      - name: dotnet restore
        working-directory: godot-ps1
        run: dotnet restore --verbosity normal

      - name: dotnet build
        working-directory: godot-ps1
        run: dotnet build --no-restore --nologo --verbosity minimal
