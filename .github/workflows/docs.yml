# Build and deploy the MkDocs site to GitHub Pages.
#
# One-time setup (do this once via GitHub UI):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# Without that, the deploy step fails with "Get Pages site failed" /
# HTTP 404. Site URL: https://buffjesus.github.io/PS1Godot/

name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/docs.yml
      - scripts/py/gen_lua_api_docs.py
      - psxsplash-main/src/luaapi.hh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - run: pip install -r requirements-docs.txt

      # Regenerate Lua API pages from psxsplash-main/src/luaapi.hh so
      # the published reference always matches the runtime surface.
      - run: python scripts/py/gen_lua_api_docs.py

      # Non-strict for the initial scaffold — existing docs have plenty
      # of relative links that will be cleaned up during the restructure
      # slice. Flip to --strict once the nav settles.
      - run: mkdocs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
