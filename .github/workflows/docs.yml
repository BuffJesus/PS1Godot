# Build and deploy the MkDocs site to GitHub Pages.
#
# One-time setup (do this once via GitHub UI):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# Without that, the deploy step fails with "Get Pages site failed" /
# HTTP 404. Site URL: https://buffjesus.github.io/PS1Godot/

name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/docs.yml
      - scripts/py/gen_lua_api_docs.py
      - psxsplash-main/src/luaapi.hh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - run: pip install -r requirements-docs.txt

      # Regenerate Lua API pages from psxsplash-main/src/luaapi.hh so
      # the published reference always matches the runtime surface.
      - run: python scripts/py/gen_lua_api_docs.py

      # Catch "luaapi.hh changed but docs/lua-api/ wasn't regenerated"
      # before it ships. The live site is always rebuilt from source
      # by the step above, but the committed .md files also serve
      # GitHub-side readers and search-engine crawlers — keeping the
      # two in sync prevents stale-content drift.
      - name: Verify lua-api pages are up to date
        run: |
          if ! git diff --exit-code docs/lua-api/; then
            echo "::error::docs/lua-api/ is stale — re-run scripts/py/gen_lua_api_docs.py and commit the result."
            exit 1
          fi

      # --strict treats warnings as errors. Build is clean as of the
      # 2026-05-19 tutorial-link cleanup. New broken cross-doc links
      # will fail CI loudly instead of shipping a 404.
      - run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
